<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Site</title>

    <style>
        /* CUSTOM WITCH HAT CURSOR */
        html, body, body * {
            cursor: url("Witch Hat Cursor.png") 0 0, auto;
        }

        a, button, input, select, textarea, label {
            cursor: url("Witch Hat Cursor.png") 0 0, pointer;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background-color: #111;
            background-image: url("FUNImages/IllusionBackdrop.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        h1 {
            text-align: center;
            font-size: 60px;
            font-weight: bold;
            color: white;
            margin-top: 20px;
            text-shadow: 0 0 10px black;
        }

        .box {
            background-color: rgba(255, 192, 203, 0.5);
            border: 5px solid white;
            border-radius: 25px;
            padding: 25px;
            width: 700px;
            max-width: calc(100% - 90px);
            margin: 60px auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        /* TOP-RIGHT BUTTONS */
        .top-buttons {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
            white-space: nowrap;
        }

        .top-buttons a {
            display: inline-block;
            background-color: white;
            color: black;
            padding: 10px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-family: Arial, sans-serif;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
            margin-left: 10px;
        }

        .top-buttons a:first-child {
            margin-left: 0;
        }

        .top-buttons a:hover {
            background-color: lightgray;
        }

        /* SECRET BUTTON */
        .secret-button {
            display: inline-block;
            width: 35px;
            height: 20px;
            margin-top: 15px;
            margin-left: 10px;
            background-color: rgba(255, 255, 255, 0.15) !important;
            color: transparent !important;
            border-radius: 8px;
            padding: 3px !important;
            box-shadow: none !important;
        }

        .secret-button:hover {
            background-color: rgba(255, 255, 255, 0.35) !important;
        }

        /* BIG RED MUSIC BUTTON */
        .music-launcher {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            margin: 25px auto;
            border: 3px solid white;
            border-radius: 50%;
            background: #e00000;
            color: white;
            font-size: 38px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s, background 0.2s;
        }

        .music-launcher:hover {
            background: #ff2020;
            transform: scale(1.08);
        }

        .music-launcher:active {
            transform: scale(0.96);
        }

        /* BOTTOM-CENTRE MINI PLAYER */
        .mini-player {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 340px;
            max-width: calc(100vw - 24px);
            box-sizing: border-box;
            padding: 15px;
            background: #111;
            border: 2px solid #e00000;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.65);
            color: white;
            font-family: Arial, sans-serif;
        }

        .mini-player[hidden] {
            display: none;
        }

        /* CLOSE BUTTON */
        .player-close {
            flex: 0 0 auto;
            border: none;
            background: transparent;
            color: white;
            font-size: 25px;
            line-height: 1;
            padding: 2px;
        }

        .player-close:hover {
            color: #ff3030;
        }

        /* SONG TITLE */
        .player-song {
            flex: 1;
            min-width: 0;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        /* SKIP SONG BUTTON */
        .player-skip {
            flex: 0 0 auto;
            border: none;
            background: transparent;
            color: white;
            font-size: 20px;
            padding: 2px;
        }

        .player-skip:hover {
            color: #ff3030;
        }

        /* VOLUME CONTROL */
        .player-volume {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .volume-label {
            font-size: 11px;
            color: #ccc;
        }

        .player-volume input {
            width: 65px;
            accent-color: #e00000;
        }

        /* EXISTING SMALL-SCREEN RULES */
        @media (max-width: 600px) {
            h1 {
                font-size: 40px;
                margin-top: 100px;
            }

            .top-buttons {
                left: 10px;
                right: 10px;
                text-align: center;
                white-space: normal;
            }

            .top-buttons a {
                margin: 4px;
                padding: 8px 10px;
            }

            .box {
                padding: 18px;
                margin: 35px auto;
            }

            .mini-player {
                gap: 9px;
                bottom: 12px;
                padding: 12px;
            }

            .player-volume input {
                width: 55px;
            }
        }

        /* ========================================
           MOBILE SUPPORT
           These overrides do not change desktop.
           ======================================== */

        @media screen and (max-width: 600px) {

            html,
            body {
                width: 100%;
                min-height: 100%;
            }

            body {
                background-color: #111;
                background-attachment: scroll;
                background-size: cover;
                background-position: center top;
                background-repeat: no-repeat;
                overflow-x: hidden;
            }

            /* MOBILE NAVIGATION */
            .top-buttons {
                position: relative;
                top: auto;
                right: auto;
                left: auto;
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
                gap: 10px;
                width: 100%;
                padding: 15px 12px;
                box-sizing: border-box;
                text-align: center;
                white-space: normal;
            }

            .top-buttons a,
            .top-buttons a:first-child {
                margin: 0;
                padding: 12px 14px;
                font-size: 15px;
                border-radius: 12px;
                max-width: 100%;
                text-align: center;
            }

            .top-buttons a.secret-button {
                width: 35px;
                height: 25px;
                padding: 3px !important;
                margin: 0;
            }

            /* MOBILE HEADING */
            h1 {
                font-size: clamp(32px, 9vw, 46px);
                line-height: 1.15;
                margin: 25px 12px 0;
                overflow-wrap: anywhere;
            }

            /* LARGER MAIN CONTENT BOX */
            .box {
                width: calc(100% - 24px);
                max-width: none;
                box-sizing: border-box;
                margin: 30px auto 100px;
                padding: 25px 18px;
                border: 4px solid white;
                border-radius: 22px;
                font-size: 18px;
                line-height: 1.6;
                overflow-wrap: anywhere;
            }

            .box h2 {
                font-size: 26px;
                line-height: 1.25;
                margin: 0 0 18px;
            }

            .box p {
                font-size: 17px;
                line-height: 1.7;
                margin: 16px 0;
            }

            /* LARGER TOUCH-FRIENDLY MUSIC BUTTON */
            .music-launcher {
                width: 100px;
                height: 100px;
                font-size: 42px;
                margin: 30px auto;
            }

            /* RESPONSIVE BOTTOM MUSIC PLAYER */
            .mini-player {
                position: fixed;
                bottom: 12px;
                left: 12px;
                right: 12px;
                transform: none;
                width: auto;
                max-width: none;
                gap: 10px;
                padding: 13px 10px;
                border-radius: 16px;
            }

            .player-close {
                font-size: 28px;
                padding: 5px;
            }

            .player-song {
                font-size: 13px;
                line-height: 1.3;
                overflow-wrap: anywhere;
            }

            .player-skip {
                font-size: 23px;
                padding: 5px;
            }

            .player-volume {
                gap: 7px;
            }

            .volume-label {
                font-size: 10px;
            }

            .player-volume input {
                width: 65px;
                max-width: 18vw;
                min-height: 24px;
            }

            /* TOUCHSCREEN BEHAVIOUR */
            button,
            .top-buttons a {
                -webkit-tap-highlight-color: transparent;
                touch-action: manipulation;
            }
        }

        /* EXTRA-SMALL PHONES */
        @media screen and (max-width: 380px) {

            h1 {
                font-size: 32px;
            }

            .top-buttons {
                gap: 7px;
                padding: 12px 8px;
            }

            .top-buttons a,
            .top-buttons a:first-child {
                font-size: 13px;
                padding: 10px;
            }

            .box {
                width: calc(100% - 16px);
                padding: 20px 14px;
            }

            .box h2 {
                font-size: 23px;
            }

            .box p {
                font-size: 16px;
            }

            .mini-player {
                gap: 5px;
                padding: 10px 7px;
            }

            .player-song {
                font-size: 11px;
            }

            .player-volume input {
                width: 42px;
            }
        }
    </style>
</head>

<body>

    <!-- TOP NAVIGATION BUTTONS -->
    <div class="top-buttons">
        <a href="about.html">About Me</a>
        <a href="sites.html">My Sites</a>
        <a href="My%20Stuff.html">NEW S*IT</a>
        <a href="Games.html">Minigames</a>
        <a href="Old%20Projects.html">Internet Scrapbook</a>

        <!-- SECRET BUTTON -->
        <a class="secret-button"
           href="https://r.mtdv.me/articles/Wackystudios13"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Secret page"
           title="Secret"></a>
    </div>

    <h1>Welcome To My Site :)</h1>

    <div class="box">
        <h2>Hello Have Fun On My Site</h2>

        <p>I Will keep Making updates To This Site When I Can</p>

        <!-- BIG RED PLAY/PAUSE BUTTON -->
        <button
            class="music-launcher"
            id="musicButton"
            type="button"
            aria-label="Play music"
            title="Play / Pause Music">
            ▶
        </button>

        <p>So Yeah Have Fun On This Dumb Site!</p>

        <p>
            I will keep updating this site. I will also add more to the minigames section :)
        </p>
    </div>

    <!-- BOTTOM MUSIC PLAYER -->
    <div class="mini-player" id="miniPlayer" hidden>

        <button
            class="player-close"
            id="closePlayer"
            type="button"
            aria-label="Close music player"
            title="Close player">
            ×
        </button>

        <div class="player-song" id="songName">
            Ready to play
        </div>

        <button
            class="player-skip"
            id="skipSong"
            type="button"
            aria-label="Skip to next song"
            title="Skip song">
            ⏭
        </button>

        <div class="player-volume">
            <span class="volume-label">VOLUME</span>
            <input
                id="volumeControl"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.5"
                aria-label="Music volume">
        </div>
    </div>

    <!-- MUSIC SYSTEM -->
    <audio id="siteAudio" preload="auto"></audio>

    <script>
        const musicButton = document.getElementById("musicButton");
        const miniPlayer = document.getElementById("miniPlayer");
        const closePlayer = document.getElementById("closePlayer");
        const skipSong = document.getElementById("skipSong");
        const songName = document.getElementById("songName");
        const volumeControl = document.getElementById("volumeControl");
        const audio = document.getElementById("siteAudio");

        // ALL MP3 FILES MUST BE BESIDE THIS HTML FILE.
        const songs = [
            {
                title: "Sweden",
                file: "Sweden.mp3"
            },
            {
                title: "Home",
                file: "Home.mp3"
            },
            {
                title: "Beethoven Symphony No. 5 - I. Allegro con brio",
                file: "Beethoven Symphony No. 5 - l. Allegro con brio.mp3"
            },
            {
                title: "Welcome To The Internet",
                file: "Welcome To The Internet.mp3"
            },
            {
                title: "Passing Through (Can't the Future Just Wait)",
                file: "Passing Through (Can't the Future Just Wait).mp3"
            },
            {
                title: "House Of The Rising Sun",
                file: "House Of The Rising Sun.mp3"
            },
            {
                title: "Blue (Da Ba Dee)",
                file: "Blue (Da Ba Dee).mp3"
            }
        ];

        let playlist = [];
        let currentIndex = 0;
        let hasStarted = false;

        audio.volume = 0.5;

        // SHUFFLE THE PLAYLIST.
        function shufflePlaylist() {
            playlist = [...songs];

            for (let i = playlist.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));

                [playlist[i], playlist[j]] =
                    [playlist[j], playlist[i]];
            }

            currentIndex = 0;
        }

        // LOAD A TRACK.
        function loadSong(index) {
            const song = playlist[index];

            if (!song) {
                return false;
            }

            audio.pause();
            audio.src = song.file;
            audio.load();

            songName.textContent = song.title;

            return true;
        }

        // UPDATE THE PLAY/PAUSE ICON.
        function updateMusicButton() {
            if (audio.paused) {
                musicButton.textContent = "▶";
                musicButton.setAttribute("aria-label", "Play music");
                musicButton.title = "Play Music";
            } else {
                musicButton.textContent = "Ⅱ";
                musicButton.setAttribute("aria-label", "Pause music");
                musicButton.title = "Pause Music";
            }
        }

        // START OR RESUME MUSIC.
        async function playMusic() {
            if (!hasStarted) {
                shufflePlaylist();
                hasStarted = true;

                if (!loadSong(currentIndex)) {
                    songName.textContent = "No songs available";
                    return;
                }
            }

            miniPlayer.hidden = false;

            try {
                await audio.play();
            } catch (error) {
                console.error("Music could not be played:", error);

                songName.textContent =
                    "Couldn't play song — check file names";

                updateMusicButton();
            }
        }

        // BIG RED BUTTON: PLAY OR PAUSE.
        musicButton.addEventListener("click", async () => {
            if (!hasStarted || audio.paused) {
                await playMusic();
            } else {
                audio.pause();
            }
        });

        audio.addEventListener("play", updateMusicButton);
        audio.addEventListener("pause", updateMusicButton);

        // SKIP TO THE NEXT TRACK.
        async function nextSong() {
            if (!hasStarted) {
                await playMusic();
                return;
            }

            currentIndex = (currentIndex + 1) % playlist.length;

            if (!loadSong(currentIndex)) {
                return;
            }

            miniPlayer.hidden = false;

            try {
                await audio.play();
            } catch (error) {
                console.error("Couldn't play the next song:", error);

                songName.textContent =
                    "Couldn't play song — check file names";

                updateMusicButton();
            }
        }

        // MANUAL SKIP.
        skipSong.addEventListener("click", nextSong);

        // AUTOMATICALLY ADVANCE WHEN A SONG FINISHES.
        audio.addEventListener("ended", nextSong);

        // REPORT MISSING OR UNPLAYABLE FILES.
        audio.addEventListener("error", () => {
            if (hasStarted && audio.src) {
                console.error("Audio file failed to load:", audio.src);
            }
        });

        // CLOSE THE PLAYER AND PAUSE MUSIC.
        closePlayer.addEventListener("click", () => {
            audio.pause();
            miniPlayer.hidden = true;
        });

        // ADJUST VOLUME.
        volumeControl.addEventListener("input", () => {
            audio.volume = Number(volumeControl.value);
        });
    </script>

</body>
</html>
